name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write  # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify npm version for OIDC
        run: |
          echo "📋 Checking npm version..."
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          # npm CLI version 11.5.1 or later is required for OIDC
          MIN_VERSION="11.5.1"
          if [ "$(printf '%s\n' "$MIN_VERSION" "$NPM_VERSION" | sort -V | tail -n1)" = "$NPM_VERSION" ]; then
            echo "✅ npm version $NPM_VERSION supports OIDC (requires $MIN_VERSION+)"
          else
            echo "❌ npm version $NPM_VERSION does not support OIDC (requires $MIN_VERSION+)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "✅ Verifying build artifacts..."
          test -f dist/cli.js || (echo "❌ Error: dist/cli.js not found" && exit 1)
          test -f dist/index.js || (echo "❌ Error: dist/index.js not found" && exit 1)
          test -f dist/index.d.ts || (echo "❌ Error: dist/index.d.ts not found" && exit 1)
          echo "✅ All required build artifacts present"

      - name: Test CLI executable
        run: |
          echo "✅ Testing CLI executable..."
          chmod +x dist/cli.js
          node dist/cli.js --help 2>&1 || true
          echo "✅ CLI executable test complete"

      - name: Update package version
        run: |
          # Extract version from GitHub release tag (remove 'v' prefix if present)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "📦 Setting package version to: $VERSION"
          npm version $VERSION --no-git-tag-version

      - name: Publish to npm (with provenance)
        run: |
          echo "📦 Publishing to npm..."
          echo "npm config registry: $(npm config get registry)"
          echo "NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:+(set)}"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+(set)}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+(set)}"
          npm publish --access public
          echo "✅ Published successfully"

      - name: Verify npm publication
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "✅ Published @shaharia-lab/ai-limit-checker@$VERSION to npm"
          echo "📦 Package URL: https://www.npmjs.com/package/@shaharia-lab/ai-limit-checker/v/$VERSION"
